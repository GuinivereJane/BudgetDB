version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budgetdb
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://budget:budget@db:5432/budgetdb
      PORT: 8000
    depends_on:
      - db
    ports:
      - '8000:8000'
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - '5173:5173'

volumes:
  pgdata:
